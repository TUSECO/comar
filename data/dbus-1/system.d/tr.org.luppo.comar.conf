<!DOCTYPE busconfig PUBLIC
 "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">

<!--
  ÇOMAR D-Bus sistem politikası.
  Kurulum: /usr/share/dbus-1/system.d/tr.org.luppo.comar.conf
-->

<busconfig>
  <!-- Yalnızca root ÇOMAR servis adına sahip olabilir -->
  <policy user="root">
    <allow own="tr.org.luppo.comar"/>
    <allow own="tr.org.luppo.comar2"/>
    <allow own="tr.org.luppo.comar.updated"/>
  </policy>

  <!-- Tüm kullanıcılar ÇOMAR'a mesaj gönderebilir;
       yetkilendirme PolicyKit tarafından yapılır -->
  <policy context="default">
    <allow send_destination="tr.org.luppo.comar"/>
    <allow send_destination="tr.org.luppo.comar2"/>
    <allow send_destination="tr.org.luppo.comar.updated"/>
  </policy>
</busconfig>
