[package]
name        = "comar-daemon"
description = "ÇOMAR (COnfiguration MAnageR) system daemon"
version.workspace     = true
edition.workspace     = true
license.workspace     = true
authors.workspace     = true
repository.workspace  = true

[[bin]]
name = "comar"
path = "src/main.rs"

[lib]
name    = "comar_daemon"
path    = "src/lib.rs"
# Test harness için; üretim binary'si yalnızca [[bin]]
[dependencies]
comar-api = { path = "../comar-api" }

tokio.workspace       = true
zbus.workspace        = true
zvariant.workspace    = true
pyo3.workspace        = true
quick-xml.workspace   = true
anyhow.workspace      = true
thiserror.workspace   = true
tracing.workspace     = true
tracing-subscriber.workspace = true
clap.workspace        = true
serde.workspace       = true
serde_json.workspace  = true
toml.workspace        = true
kdl.workspace         = true
nix.workspace         = true
rust-i18n             = "3"
futures-util          = "0.3"
regex                 = "1"

[dev-dependencies]
mockall.workspace     = true
tokio-test.workspace  = true
tempfile              = "3"
